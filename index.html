
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1c1c1c">

  <title>PhotoShare</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #1c1c1c;
      color: #f5f5f5;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0 28px;
    }

    .logo-area {
      height: 38vh;
      min-height: 230px;
      max-height: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .camera-logo {
      width: 106px;
      height: 106px;
      display: block;
    }

    .form-area {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .field {
      display: block;
      width: 100%;
      height: 104px;
      padding: 0 27px;
      margin-bottom: 20px;
      border: 2px solid #484848;
      border-radius: 28px;
      background: transparent;
      color: #ffffff;
      font-size: 20px;
      outline: none;
    }

    .field::placeholder {
      color: #a5a5ad;
      opacity: 1;
    }

    .field:focus {
      border-color: #696969;
    }

    .login-button {
      display: block;
      width: 100%;
      height: 78px;
      margin-top: 1px;
      border: none;
      border-radius: 45px;
      background: #0866e9;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .forgot {
      display: block;
      margin-top: 40px;
      text-align: center;
      color: #f5f5f5;
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
      cursor: default;
    }

    @media (max-height: 750px) {
      .logo-area {
        height: 32vh;
        min-height: 180px;
      }

      .field {
        height: 72px;
        margin-bottom: 14px;
      }

      .login-button {
        height: 62px;
      }

      .forgot {
        margin-top: 28px;
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 20px;
        padding-right: 20px;
      }

      .field {
        padding: 0 20px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="logo-area">
      <svg
        class="camera-logo"
        viewBox="0 0 110 110"
        xmlns="http://www.w3.org/2000/svg"
        aria-label="Camera logo"
        role="img"
      >
        <defs>
          <linearGradient
            id="cameraGradient"
            x1="0"
            y1="1"
            x2="1"
            y2="0"
          >
            <stop offset="0%" stop-color="#ffca35"/>
            <stop offset="28%" stop-color="#ff304f"/>
            <stop offset="58%" stop-color="#e000a8"/>
            <stop offset="80%" stop-color="#b000ee"/>
            <stop offset="100%" stop-color="#654cff"/>
          </linearGradient>
        </defs>

        <rect
          x="9"
          y="9"
          width="92"
          height="92"
          rx="27"
          fill="none"
          stroke="url(#cameraGradient)"
          stroke-width="8"
        />

        <circle
          cx="55"
          cy="55"
          r="23"
          fill="none"
          stroke="url(#cameraGradient)"
          stroke-width="8"
        />

        <circle
          cx="81"
          cy="29"
          r="6"
          fill="#c000dc"
        />
      </svg>
    </section>

    <section class="form-area">
      <form id="loginForm" autocomplete="off">

        <input
          class="field"
          type="text"
          name="demoUsername"
          placeholder="Username, email or mobile number"
          aria-label="Username, email or mobile number"
          required
        >

        <input
          class="field"
          type="password"
          name="demoPassword"
          placeholder="Password"
          aria-label="Password"
          autocomplete="new-password"
          required
        >

        <button class="login-button" type="submit">
          Log in
        </button>

      </form>

      <a
        class="forgot"
        href="#"
        aria-disabled="true"
        id="forgotLink"
      >Forgot password?</a>
    </section>

  </main>

  <script>
    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
      });

    document
      .getElementById("forgotLink")
      .addEventListener("click", function(event) {
        event.preventDefault();
      });
  </script>
</body>
</html>
