
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoShare | Demo Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      font-family: Arial, Helvetica, sans-serif;
      color: #262626;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 350px;
    }

    .login-card {
      background: #fff;
      border: 1px solid #dbdbdb;
      padding: 35px 35px 25px;
      text-align: center;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 40px;
      font-weight: bold;
      letter-spacing: -2px;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 14px;
      color: #737373;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .field {
      display: block;
      width: 100%;
      padding: 12px 9px;
      margin-bottom: 7px;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      background: #fafafa;
      font-size: 12px;
      outline-color: #a8a8a8;
    }

    .login-button {
      width: 100%;
      border: none;
      border-radius: 7px;
      padding: 10px;
      margin-top: 9px;
      background: #3797f0;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #1877e2;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 25px 0;
      color: #8e8e8e;
      font-size: 12px;
      font-weight: bold;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #dbdbdb;
      flex: 1;
    }

    .help-link {
      color: #385185;
      font-size: 12px;
      text-decoration: none;
    }

    .message {
      font-size: 12px;
      line-height: 1.5;
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .signup-card {
      background: white;
      border: 1px solid #dbdbdb;
      margin-top: 10px;
      padding: 22px 10px;
      text-align: center;
      font-size: 14px;
    }

    .signup-card a {
      color: #0095f6;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      color: #8e8e8e;
      font-size: 11px;
      line-height: 1.8;
      margin-top: 24px;
    }

    @media (max-width: 400px) {
      .login-card {
        padding: 30px 22px 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="login-card">
      <h1 class="logo">PhotoShare</h1>

      <p class="subtitle">
        A demo social platform for learning web development.
      </p>

      <form id="loginForm">
        <input
          class="field"
          type="text"
          name="demoUsername"
          placeholder="Demo username"
          autocomplete="off"
          required
        >

        <input
          class="field"
          type="password"
          name="demoPassword"
          placeholder="Demo password"
          autocomplete="new-password"
          required
        >

        <button class="login-button" type="submit">
          Log in
        </button>
      </form>

      <div class="divider">OR</div>

      <a class="help-link" href="#help">
        Demo help
      </a>

      <p class="message" id="message" role="status">
        Practice only. Do not enter real account credentials.
      </p>
    </section>

    <section class="signup-card">
      New to PhotoShare?
      <a href="#signup" id="signupLink">Learn more</a>
    </section>

    <footer class="footer">
      <p>PhotoShare Demo · Educational project</p>
      <p>No information is collected or transmitted.</p>
    </footer>

  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      form.reset();

      message.textContent =
        "Demo successful! No data was saved or sent.";
    });

    document.getElementById("signupLink")
      .addEventListener("click", function(event) {
        event.preventDefault();

        message.textContent =
          "This is a learning project. Sign-up is not enabled.";
      });

    document.querySelector(".help-link")
      .addEventListener("click", function(event) {
        event.preventDefault();

        message.textContent =
          "This demo does not connect to any real account.";
      });
  </script>
</body>
</html>
